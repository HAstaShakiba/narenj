name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-rsvg-2.0 ffmpeg
      - name: Test
        run: python3 -m unittest discover -s tests -v

  # Windows: the same tests on MSYS2's Python and GTK, then a self-contained build (Python, GTK,
  # static ffmpeg) that must start on its own, packed into an Inno Setup installer.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-ntldd
            unzip
      - name: Fetch ffmpeg
        run: |
          # newest stable static build (BtbN keeps only the last few release branches)
          url=$(curl -fsSL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | python -c "import json,sys,re; a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if re.fullmatch(r'ffmpeg-n[0-9.]+-latest-win64-gpl-[0-9.]+\.zip', x['name'])]; print(sorted(a, key=lambda u: [int(n) for n in re.search(r'-n([0-9.]+)-', u).group(1).split('.')])[-1])")
          echo "ffmpeg: $url"
          curl -fsSL -o ffmpeg.zip "$url"
          unzip -q ffmpeg.zip -d ffmpeg
          mv ffmpeg/*/bin ffmpeg-bin
          cp ffmpeg/*/LICENSE.txt ffmpeg-bin/ || true
      - name: Test
        run: PATH="$PWD/ffmpeg-bin:$PATH" packaging/windows/report.sh "Windows tests" python -m unittest discover -s tests -v
      - name: Build
        run: packaging/windows/report.sh "Windows build" packaging/windows/build.sh ffmpeg-bin
      - name: Self-test the build outside MSYS2
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:NARENJ_SELF_TEST = "1"
          $app = "dist\windows\Narenj"
          $p = Start-Process "$app\bin\python.exe" -ArgumentList "$app\share\narenj\narenj.py" `
            -PassThru -NoNewWindow -Wait -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet "self-test" out.txt)) {
            $log = ((Get-Content out.txt, err.txt -Raw) -join "`n")
            if ($log.Length -gt 3500) { $log = $log.Substring($log.Length - 3500) }
            Write-Output ("::error title=Windows self-test::" + ($log -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"))
            exit 1
          }
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe")) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DVersion=$v" packaging\windows\narenj.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/narenj-*-setup.exe

  # A pushed tag like v1.0.1 builds that version's .deb and publishes it, with the Windows
  # installer, as a GitHub release.
  # The signed apt repository is still published locally (packaging/publish-apt.sh), since
  # its signing key never leaves the maintainer's machine.
  release:
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build package
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/narenj-*-setup.exe \
            --verify-tag --title "Narenj ${GITHUB_REF_NAME#v}" --generate-notes
