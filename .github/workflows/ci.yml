name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-rsvg-2.0 ffmpeg
      - name: Test
        run: python3 -m unittest discover -s tests -v

  # Windows: the same tests on MSYS2's Python and GTK, then a self-contained build (Python, GTK,
  # a slim ffmpeg built here and cached) that must start on its own, packed into an installer.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-ccache
            make
            diffutils
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ffmpeg-bin
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packaging/build-ffmpeg.sh', 'packaging/windows/ffmpeg.sh') }}
      # ccache keeps compiled objects between ffmpeg builds, so a rebuild only compiles what changed
      - uses: actions/cache@v4
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content  # the toolchain is reinstalled every run, so not by date
        run: packaging/windows/report.sh "Windows ffmpeg build" packaging/build-ffmpeg.sh ffmpeg-bin packaging/windows/ffmpeg.sh
      - name: Test
        run: PATH="$PWD/ffmpeg-bin:$PATH" packaging/windows/report.sh "Windows tests" python -m unittest discover -s tests -v
      - name: Build
        run: packaging/windows/report.sh "Windows build" packaging/windows/build.sh ffmpeg-bin
      - name: Self-test the build outside MSYS2
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:NARENJ_SELF_TEST = "1"
          $app = "dist\windows\Narenj"
          $p = Start-Process "$app\bin\python.exe" -ArgumentList "$app\share\narenj\narenj.py" `
            -PassThru -NoNewWindow -Wait -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet "self-test" out.txt)) {
            $log = ((Get-Content out.txt, err.txt -Raw) -join "`n")
            if ($log.Length -gt 3500) { $log = $log.Substring($log.Length - 3500) }
            Write-Output ("::error title=Windows self-test::" + ($log -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"))
            exit 1
          }
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe")) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DVersion=$v" packaging\windows\narenj.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/narenj-*-setup.exe

  # macOS: the tests and a start-up check on Homebrew's GTK and Python, the Homebrew formula,
  # and a self-contained Narenj.app (Apple Silicon) with the slim ffmpeg, packed into a DMG.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita pygobject3 py3cairo librsvg ffmpeg adwaita-icon-theme \
            x264 libvpx opus lame libvorbis webp dav1d nasm pkgconf ccache
      - name: Find pygobject's Python
        run: |
          py="$(brew deps pygobject3 | grep '^python@' | sort -V | tail -1)"
          echo "PYTHON=$(brew --prefix "$py")/libexec/bin/python" >> "$GITHUB_ENV"
      - name: Test
        run: packaging/windows/report.sh "macOS tests" "$PYTHON" -m unittest discover -s tests -v
      - name: Self-test
        timeout-minutes: 3
        run: |
          NARENJ_SELF_TEST=1 packaging/windows/report.sh "macOS self-test" "$PYTHON" narenj.py
          grep -q "self-test" report.log
      - name: Homebrew formula
        run: |
          brew tap-new --no-git local/narenj
          cp Formula/narenj.rb "$(brew --repository local/narenj)/Formula/"
          packaging/windows/report.sh "Homebrew formula" brew install --formula local/narenj/narenj
          packaging/windows/report.sh "Homebrew formula test" brew test local/narenj/narenj
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ffmpeg-mac
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packaging/build-ffmpeg.sh', 'packaging/macos/ffmpeg.sh') }}
      - uses: actions/cache@v4
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content
        run: packaging/windows/report.sh "macOS ffmpeg build" packaging/build-ffmpeg.sh ffmpeg-mac packaging/macos/ffmpeg.sh
      - name: Build the app
        run: |
          v="$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0-dev)"
          packaging/windows/report.sh "macOS app build" packaging/macos/build-app.sh "$PYTHON" ffmpeg-mac "$v"
      - name: Self-test the app
        timeout-minutes: 3
        run: |
          NARENJ_SELF_TEST=1 packaging/windows/report.sh "macOS app self-test" dist/Narenj.app/Contents/MacOS/Narenj
          grep -q "self-test" report.log
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/narenj-*-macos.dmg

  # A pushed tag like v1.0.1 builds that version's .deb and publishes it, with the Windows
  # installer, as a GitHub release, then points the Homebrew formula at it.
  # The signed apt repository is still published locally (packaging/publish-apt.sh), since
  # its signing key never leaves the maintainer's machine.
  release:
    needs: [test, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build package
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/narenj-*-setup.exe dist/narenj-*-macos.dmg \
            --verify-tag --title "Narenj ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Point the Homebrew formula at this release
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          git fetch -q origin main && git checkout -q -B main origin/main
          sed -i -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/narenj.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Homebrew: narenj ${GITHUB_REF_NAME#v}" && git push -q origin main
