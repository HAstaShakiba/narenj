name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-rsvg-2.0 ffmpeg
      - name: Test
        run: python3 -m unittest discover -s tests -v

  # A pushed tag like v1.0.1 builds that version's .deb and publishes it as a GitHub release.
  # The signed apt repository is still published locally (packaging/publish-apt.sh), since
  # its signing key never leaves the maintainer's machine.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --verify-tag --title "Narenj ${GITHUB_REF_NAME#v}" --generate-notes
